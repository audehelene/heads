<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Heads — Play</title>
  <meta name="description" content="Spin the Heads slot machine." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="game">
    <!-- Scalable arcade stage (1366x900). Everything positions as % of it. -->
    <div class="stage" id="stage">
      <!-- Background scene: gold frame + black screen + scenery (desktop) -->
      <img class="stage__scene" src="assets/svg/ui/Slot_Display_start2.svg" alt="" aria-hidden="true" />

      <!-- Title + home in the thin strip above the frame -->
      <header class="stage__top">
        <span class="stage__title">HEADS</span>
        <a class="stage__home" href="index.html">← home</a>
      </header>

      <!-- Screen window (black frame on desktop; full-width frame crop on
           mobile). Holds the slot machine. Cover art is the landing state;
           PLAY reveals the three reels. -->
      <div class="screen" id="screen">
        <div class="machine is-cover" id="machine">
          <img class="cover" id="cover" src="assets/svg/cover/000_FRONT.svg" alt="Heads cover" />
          <div class="reel" data-pos="t">
            <img class="reel__img" id="reel-t" alt="top slice" />
          </div>
          <div class="reel" data-pos="m">
            <img class="reel__img" id="reel-m" alt="middle slice" />
          </div>
          <div class="reel" data-pos="b">
            <img class="reel__img" id="reel-b" alt="bottom slice" />
          </div>
        </div>
      </div>

      <!-- Custom SVG buttons: Reset (left), Play (right).
           Default art via CSS; :hover and .is-spinning swap the state art. -->
      <div class="stage__controls">
        <button class="gbtn gbtn--reset" id="reset" aria-label="Reset"></button>
        <button class="gbtn gbtn--play" id="play" aria-label="Play"></button>
      </div>
    </div>
  </main>

  <!-- Win modal (placeholder until the winning animation asset exists) -->
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal__box">
      <h2 id="modal-title">You win!</h2>
      <p>All three thirds matched. (Winning animation coming soon.)</p>
      <button class="btn" id="modal-close">PLAY AGAIN</button>
    </div>
  </div>

  <!-- Dev panel: hidden unless ?dev=1 or the key combo (see app.js) -->
  <aside class="dev" id="dev">
    <h3>Dev</h3>
    <label><input type="checkbox" id="dev-force" /> Force next win</label>
    <label><input type="checkbox" id="dev-boost" /> Boost odds (~15%)</label>
  </aside>

  <script src="app.js"></script>
</body>
</html>
